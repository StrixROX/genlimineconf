name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: make

      - name: Create archive
        id: archive
        run: |
          archive="genlimineconf-${{ github.ref_name }}.tar.gz"
          tar -czvf "$archive" -C dist .
          echo "name=$archive" >> "$GITHUB_OUTPUT"

      - name: Compute checksum
        id: checksum
        run: |
          sha256sum "${{ steps.archive.outputs.name }}" > "${{ steps.archive.outputs.name }}.sha256"
          echo "value=$(cut -d' ' -f1 "${{ steps.archive.outputs.name }}.sha256")" >> "$GITHUB_OUTPUT"

      - name: Install xbps host tools
        run: |
          curl -fsSL https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz -o /tmp/xbps-static.tar.xz
          sudo tar -xJf /tmp/xbps-static.tar.xz -C /

      - name: Build .xbps package
        id: xbps
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git /tmp/void-packages
          cd /tmp/void-packages
          ./xbps-src binary-bootstrap
          ln -s "$GITHUB_WORKSPACE/void-srcpkg/genlimineconf" srcpkgs/genlimineconf
          ./xbps-src pkg genlimineconf

          xbps_file="$(find hostdir/binpkgs -name 'genlimineconf-*.xbps' | head -n1)"
          cp "$xbps_file" "$GITHUB_WORKSPACE/"
          echo "xbps_name=$(basename "$xbps_file")" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            ${{ steps.archive.outputs.name }}
            ${{ steps.archive.outputs.name }}.sha256
            ${{ steps.xbps.outputs.xbps_name }}
          body: |
            ## SHA256 (source tarball)

            ```
            ${{ steps.checksum.outputs.value }}  ${{ steps.archive.outputs.name }}
            ```
