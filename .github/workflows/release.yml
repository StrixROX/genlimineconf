name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: make

      - name: Create archive
        id: archive
        run: |
          archive="genlimineconf-${{ github.ref_name }}.tar.gz"
          tar -czvf "$archive" -C dist .
          echo "name=$archive" >> "$GITHUB_OUTPUT"

      - name: Compute checksum
        id: checksum
        run: |
          sha256sum "${{ steps.archive.outputs.name }}" > "${{ steps.archive.outputs.name }}.sha256"
          echo "value=$(cut -d' ' -f1 "${{ steps.archive.outputs.name }}.sha256")" >> "$GITHUB_OUTPUT"

      - name: Generate srcpkg template
        run: |
          version="${GITHUB_REF_NAME#v}"
          src_url="https://github.com/StrixROX/genlimineconf/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          checksum="$(curl -fsSL "$src_url" | sha256sum | cut -d' ' -f1)"

          sed -e "s/@VERSION@/$version/" -e "s/@CHECKSUM@/$checksum/" \
            void-srcpkg/genlimineconf/template.in > dist/srcpkg_template

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            ${{ steps.archive.outputs.name }}
            ${{ steps.archive.outputs.name }}.sha256
            dist/srcpkg_template
          body: |
            ## SHA256 (source tarball)

            ```
            ${{ steps.checksum.outputs.value }}  ${{ steps.archive.outputs.name }}
            ```
